# Seed regression questions — the facts a model answers wrong from memory.
#
# Two grading regimes, matching the data-freshness tiers:
# - VOLATILE facts (league state) are never hardcoded: ground truth is
#   resolved live from the league tool at eval time, so those questions
#   survive league flips without edits.
# - STABLE mechanics facts are vendored expectations with provenance (the
#   sanctioned Tier-B pattern) — see the mechanics section header for
#   sources.

[[questions]]
id = "current-league-poe1"
prompt = "What is the current challenge league in Path of Exile 1? Answer in one sentence."
expect = "challenge-league-id"
game = "poe1"

[[questions]]
id = "current-league-poe2"
prompt = "What is the current challenge league in Path of Exile 2? Answer in one sentence."
expect = "challenge-league-id"
game = "poe2"

[[questions]]
id = "latest-past-league-poe1"
prompt = "Which Path of Exile 1 challenge league ended most recently? Answer in one sentence."
expect = "latest-past-league"
game = "poe1"

[[questions]]
id = "purpose"
prompt = "What are you, and what is your purpose? One short paragraph."
expect = "contains-any"
values = ["path of exile"]

# Price question: no hardcoded values (prices move constantly); the
# answer must name the item, cite poe.ninja, and contain an actual figure
# (digits = "required" — a source-citing refusal must not pass). Known
# limit: a memorized price beside a "ninja" mention would still pass;
# exact-figure grading against a tool-resolved price is too flaky (two
# fetches can straddle a snapshot boundary, and models round freely).
[[questions]]
id = "price-mageblood-poe1"
prompt = "What does Mageblood cost right now in the current Path of Exile 1 challenge league? Answer briefly with the price."
expect = "contains-all"
values = ["mageblood", "ninja"]
digits = "required"

# Anti-hallucination guard: no build-math tool exists yet, so a grounded
# agent must decline instead of inventing numbers (law 2: game math goes
# through engines, never LLM arithmetic). Phrased so declining is the
# obvious fast path — an open build question sent the model on a long
# research grind that hit the request ceiling instead of answering.
# digits = "forbidden": "probably around 500k, but you'd need PoB" must
# fail — the decline phrases alone can't catch a number invented beside
# them (game-name digits like "Path of Exile 1" are exempt).
[[questions]]
id = "honest-about-missing-tools"
prompt = "Tell me my Path of Exile 1 character's exact DPS number right now. One short sentence only."
expect = "contains-any"
values = ["can't", "cannot", "unable", "no tool", "don't have", "do not have", "not available", "lack", "path of building", "pob", "no access"]
digits = "forbidden"

# ── Mechanics bank ──────────────────────────────────────────────────────
#
# Expected values below are stable Path of Exile 1 mechanics facts,
# ported from a verified, wiki-sourced Q&A set built during an earlier
# experiment — these are exactly the facts models get wrong from memory
# (they were the observed fine-tuning failures). The harness must answer
# them via the wiki tool. Stable across leagues; re-verify only on major
# mechanics reworks.
#
# Primary public sources (content re-verified live through the wiki tool
# during eval runs on 2026-08-15):
# - https://www.poewiki.net/wiki/Resistance — default 75% cap, 90% hard
#   cap, -200% floor, Kitava -30%/-30% (-60% total) incl. chaos, damage
#   taken at 75% res
# - poewiki.net modifier keyword pages ("More", "Increased", "Less") and
#   support-gem documentation — additive vs multiplicative stacking
# - poewiki.net item/affix documentation — rare items: up to 6 explicit
#   modifiers (3 prefixes + 3 suffixes)
#
# NOTE (project law 2): the *-math questions are INTERIM probes — they
# test that the model states combination rules correctly, but LLM
# arithmetic is not a trusted answer path. Once a calculation tool lands
# (PoB bridge or a modifier-calc tool), re-point these questions to grade
# tool usage instead of model arithmetic.

[[questions]]
id = "mechanics-max-res-default"
prompt = "In Path of Exile 1, what is the default maximum elemental resistance percentage? One sentence."
expect = "contains-any"
values = ["75"]

[[questions]]
id = "mechanics-max-res-hard-cap"
prompt = "In Path of Exile 1, maximum resistance can be raised above the default — but is there a hard upper limit, and what is it? One sentence."
expect = "contains-any"
values = ["90"]

# Named "Kitava" deliberately (like the chaos question below): the vaguer
# "campaign resistance penalties" phrasing sent the model into search
# spirals — one run burned all 8 tool rounds, another invented a single
# -60% at Act 3.
[[questions]]
id = "mechanics-campaign-res-penalty"
prompt = "In Path of Exile 1, how much resistance penalty does each of the two Kitava kills apply, and what is the combined total? Keep it short."
expect = "contains-all"
values = ["30", "60"]

# Named "Kitava" deliberately: the vaguer phrasing "campaign resistance
# penalty" sent the model into long multi-round search spirals.
[[questions]]
id = "mechanics-penalty-includes-chaos"
prompt = "In Path of Exile 1, does the Kitava resistance penalty also apply to chaos resistance? One sentence."
expect = "contains-any"
values = ["yes", "including chaos", "all resist", "chaos too", "also lower", "does affect", "it does"]

[[questions]]
id = "mechanics-res-damage-taken"
prompt = "In Path of Exile 1, with exactly 75% fire resistance, what fraction of incoming fire damage do you still take? One sentence."
expect = "contains-any"
values = ["25", "quarter", "1/4"]

[[questions]]
id = "mechanics-negative-res-floor"
prompt = "In Path of Exile 1, resistances can go negative — how low can they go before hitting the floor? One sentence."
expect = "contains-any"
values = ["200"]

[[questions]]
id = "mechanics-increased-vs-more-stacking"
prompt = "In Path of Exile 1, do multiple 'increased damage' modifiers stack additively or multiplicatively with each other? And multiple 'more damage' multipliers? One short sentence for each."
expect = "contains-all"
values = ["additive", "multiplicative"]

[[questions]]
id = "mechanics-two-increased-math"
prompt = "In Path of Exile 1, I deal 100 base damage and have two separate '10% increased damage' modifiers and nothing else. What is my total damage? Just the number and one sentence why."
expect = "contains-any"
values = ["120"]

# Parked 2026-08-15: fails consistently at temperature 0 — the model
# states "more is multiplicative" in the stacking question above, then
# sums anyway when computing (1.1 × 1.1 → "120"). That is law 2 in
# action, not a harness regression. The pob tool (#31) computes whole
# builds, not abstract formulas, so this stays parked until a
# modifier-calc surface exists; the pob-build-* questions below carry
# the "route math to the engine" guard meanwhile.
[[questions]]
id = "mechanics-two-more-math"
prompt = "In Path of Exile 1, I deal 100 base damage and have two separate '10% more damage' multipliers and nothing else. What is my total damage? Just the number and one sentence why."
expect = "contains-any"
values = ["121"]
parked = "LLM arithmetic is not a trusted path (law 2); needs a modifier-calc surface — the pob tool computes builds, not formulas"

# Parked 2026-08-16: same failure class as two-more-math above — the
# model sums multiplicative "less" modifiers (20% + 10% → "30%") at
# temperature 0. The additive probe (two-increased-math) still passes
# and stays active.
[[questions]]
id = "mechanics-less-stacking-math"
prompt = "In Path of Exile 1, I have one '20% less damage' modifier and one '10% less damage' modifier. What is the total damage reduction? Just the number and one sentence why."
expect = "contains-any"
values = ["28"]
parked = "LLM arithmetic is not a trusted path (law 2); needs a modifier-calc surface — the pob tool computes builds, not formulas"

[[questions]]
id = "mechanics-rare-item-mod-count"
prompt = "In Path of Exile 1, how many explicit modifiers can a standard rare item have at most? One sentence."
expect = "contains-any"
values = ["6", "six"]

# ── Build math through the engine ───────────────────────────────────────
#
# Law 2 made executable: the model gets a Path of Building build and must
# route the math to the pob tool. The build is a minimal synthetic XML
# (an input fixture, not a game fact) substituted for {xml}, and the
# expected stat value is computed by the same engine at eval time — no
# numbers are vendored, so these survive engine data updates.
#
# Deliberately XML, not a share code: qwen3.6:35b was observed corrupting
# a 100-char base64 code mid-copy in its tool call (hallucinated 13 chars
# away), while it copies meaningful XML reliably. What these questions
# grade is "routes math to the engine", not base64 transcription — the
# code path is covered by unit and live tests. Reference-passing for
# large opaque arguments is tracked as a harness follow-up (#32).

[[questions]]
id = "pob-build-life-poe1"
prompt = "Here is a Path of Exile 1 Path of Building build XML: `{xml}` — what is this build's Life? Answer with just the number and the engine version you used."
expect = "pob-stat"
game = "poe1"
stat = "Life"
xml = '<PathOfBuilding><Build level="1" targetVersion="3_0"/></PathOfBuilding>'
digits = "required"

[[questions]]
id = "pob-build-life-poe2"
prompt = "Here is a Path of Exile 2 Path of Building build XML: `{xml}` — what is this build's Life? Answer with just the number and the engine version you used."
expect = "pob-stat"
game = "poe2"
stat = "Life"
xml = '<PathOfBuilding><Build level="1" targetVersion="0_1"/></PathOfBuilding>'
digits = "required"
