[workspace]
resolver = "3"
members = [
    "crates/exile-core",
    "crates/exile-tool-api",
    "crates/exile-llm",
    "crates/exile-cli",
    "crates/exile-toolkit",
    "crates/exile-tools/exile-league",
    "crates/exile-tools/exile-wiki",
    "eval",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/timeloop-vault/exile-harness"

[workspace.dependencies]
# External dependencies are added the milestone that first needs them,
# always as workspace deps so versions stay unified.
exile-core = { path = "crates/exile-core" }
exile-league = { path = "crates/exile-tools/exile-league" }
exile-llm = { path = "crates/exile-llm" }
exile-tool-api = { path = "crates/exile-tool-api" }
exile-toolkit = { path = "crates/exile-toolkit" }
exile-wiki = { path = "crates/exile-tools/exile-wiki" }

jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
